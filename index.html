<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172122">
<link rel="icon" href="data:,">
<title>《被紀念的痕跡》</title>
<style>
  :root{color-scheme:dark;--ink:#f1ecdf;--muted:#b5bcb6;--crimson:#d96b62;--gold:#ebdca8}
  *{box-sizing:border-box}
  body{margin:0;background:#172122;color:var(--ink);font-family:"Noto Serif TC","Songti TC",serif;transition:background-color 1.4s ease,filter 1.4s ease}
  body.grace-perspective{background:#1c2423}
  #gl{position:fixed;inset:0;transition:filter 1.6s ease,transform 1.6s ease}
  #gl canvas{display:block;width:100%;height:100%}
  body[data-stage="INVITE"] #gl{filter:brightness(.78) contrast(1.06) sepia(.14)}
  body[data-stage="REVEAL"] #gl,body[data-stage="END"] #gl{filter:brightness(1.04) contrast(1.05)}

  /* Stage 3 Perspective Shift Veil & Filter Transition */
  #perspective-veil{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 48%,rgba(235,220,168,.12),rgba(8,14,15,.68));transition:opacity 1.4s ease;z-index:1}
  #perspective-veil.active{opacity:1;animation:perspectiveShift 1.8s ease forwards}
  @keyframes perspectiveShift{
    0%{opacity:0;backdrop-filter:blur(0px)}
    45%{opacity:.92;backdrop-filter:blur(3px)}
    100%{opacity:.35;backdrop-filter:blur(0px)}
  }

  /* Stage 1 & 3 Palm Outline Guide Frame */
  #palm-guide{position:fixed;top:44%;left:50%;transform:translate(-50%,-50%);width:clamp(180px,28vmin,260px);height:clamp(220px,34vmin,320px);border:1.5px dashed rgba(241,236,223,.38);border-radius:46% 46% 38% 38%;pointer-events:none;z-index:2;display:flex;align-items:center;justify-content:center;transition:border-color .8s ease,box-shadow .8s ease,opacity .6s ease}
  #palm-guide::after{content:"";width:72%;height:76%;border:1px solid rgba(241,236,223,.22);border-radius:48% 48% 40% 40%}
  #palm-guide[data-guide-mode="gentle"]{border-color:rgba(235,220,168,.55);box-shadow:0 0 28px rgba(235,220,168,.16)}

  /* Action Item 1: Unified single header《被紀念的痕跡》 */
  header{position:fixed;top:26px;left:32px;pointer-events:none;z-index:3}
  h1{font-size:20px;letter-spacing:.22em;font-weight:400;margin:0}
  #mode{position:fixed;right:30px;top:30px;font:11px system-ui;color:var(--muted);letter-spacing:.1em;z-index:3}

  /* Copy & CSS Animation Delay Settings */
  #copy{position:fixed;bottom:98px;left:8%;right:8%;text-align:center;pointer-events:none;z-index:3}
  h2{font-size:clamp(20px,3.1vw,30px);font-weight:400;letter-spacing:.12em;margin:0 0 12px;transition:opacity .9s ease}
  body[data-stage="LOSS"] h2{transition-delay:3s}
  #message{font-size:clamp(13px,1.7vw,17px);line-height:1.8;letter-spacing:.06em;color:var(--muted);margin:0;min-height:1.8em;transition:opacity .9s ease}
  #message strong{color:var(--ink);font-weight:600}
  #scripture{margin:14px auto 0;max-width:680px;padding:12px 20px;border-top:1px solid rgba(235,220,168,.28);font-size:clamp(13px,1.55vw,16px);line-height:1.85;letter-spacing:.08em;color:#e7dec8;background:rgba(15,23,24,.72);border-radius:8px;transition:opacity 1.1s ease .4s}

  /* Stage 5 Full Journey Split-Screen & Sequential Replay Panel */
  #journey-replay{position:fixed;top:76px;left:50%;transform:translateX(-50%);display:flex;gap:16px;padding:12px 16px;background:rgba(14,22,23,.86);border:1px solid rgba(235,220,168,.28);border-radius:14px;z-index:4;backdrop-filter:blur(6px)}
  .replay-card{width:clamp(130px,22vw,185px);text-align:center;padding:8px;border-radius:10px;border:1px solid transparent;transition:border-color .4s ease,transform .4s ease}
  .replay-card.active{border-color:rgba(235,220,168,.65);transform:translateY(-2px)}
  .replay-card canvas{width:100%;height:auto;border-radius:6px;display:block;margin-bottom:6px;background:#132021}
  .replay-card span{display:block;font:11px/1.4 system-ui;color:var(--muted);letter-spacing:.06em}

  #controls{position:fixed;bottom:26px;left:0;right:0;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;z-index:4}
  button{font-size:12px;line-height:1.4;font-family:inherit;letter-spacing:.08em;border:1px solid #aebbb34d;background:#152021c9;color:var(--ink);padding:10px 18px;border-radius:24px;cursor:pointer}
  button:hover{background:#344143}button:focus-visible{outline:2px solid #eee3cb;outline-offset:4px}button:disabled{opacity:.5;cursor:wait}
  #camera,#replay{background:#eee5d3;color:#293230;border-color:#eee5d3}
  #meter{width:140px;height:2px;background:#ffffff20;margin:15px auto 0}
  #bar{height:100%;background:var(--crimson);width:0%;transition:width .15s}
  #preview-panel{position:fixed;bottom:130px;left:24px;width:240px;border:1px solid #d8dec447;border-radius:10px;background:#132021;overflow:hidden;z-index:3}
  #preview{display:block;width:100%;height:auto}
  #tracking-status{margin:8px 10px;font:12px/1.6 system-ui;color:#d7e7df}
  #preview-panel::before{content:"只顯示手部辨識結果";display:block;padding:7px 10px;background:#0e1718;color:#9db4aa;font:10px system-ui;letter-spacing:.08em}
  #privacy{position:fixed;left:24px;bottom:8px;font:10px system-ui;color:#93a39c;z-index:3}
  #debug{position:fixed;top:90px;left:24px;font:11px monospace;color:#c6d6b6;z-index:4}
  [hidden]{display:none!important}
  @media(max-width:600px){header{top:20px;left:20px}h1{font-size:16px}#mode{top:24px;right:18px;font-size:10px}#copy{bottom:118px;left:6%;right:6%}#controls{bottom:36px;gap:6px}button{padding:9px 12px;font-size:11px}#preview-panel{width:144px;left:12px;top:84px;bottom:auto}#tracking-status{font-size:10px;margin:5px 7px}#journey-replay{top:62px;gap:8px;padding:8px}#privacy{left:0;right:0;text-align:center}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script type="importmap">{"imports":{"three":"./assets/vendor/three.module.js"}}</script>
</head>
<body data-stage="HOME">
<main id="gl" aria-label="立體石膏板，手印直接凹入表面"></main>
<div id="perspective-veil" aria-hidden="true"></div>
<div id="palm-guide" hidden aria-hidden="true"></div>
<header><h1>《被紀念的痕跡》</h1></header>
<div id="mode">力度測試 · 階段一</div>
<section id="copy" aria-live="polite" aria-atomic="true">
  <h2 id="headline">留下你的痕跡</h2>
  <p id="message">這是一個關於你存在的測試。請將手掌貼近鏡頭，並<strong>盡你所能，用力按壓</strong>。</p>
  <blockquote id="scripture" hidden>我未成形的體質，你的眼早已看見了；你所定的日子，我尚未度一日，都在你的冊子寫上了。（詩篇 139:16）</blockquote>
  <div id="meter" hidden><div id="bar"></div></div>
</section>
<section id="journey-replay" hidden aria-label="完整歷程對比回放">
  <div class="replay-card" id="replay-card-effort">
    <canvas id="replay-effort-canvas" width="160" height="160"></canvas>
    <span>階段二：用力按壓（逐漸消退）</span>
  </div>
  <div class="replay-card" id="replay-card-grace">
    <canvas id="replay-grace-canvas" width="160" height="160"></canvas>
    <span>階段四：輕輕放置（永恆印記）</span>
  </div>
</section>
<aside id="preview-panel" hidden>
  <canvas id="preview" aria-label="只顯示手部辨識結果；綠色掌形代表姿勢適合，黃色代表需要調整"></canvas>
  <p id="tracking-status" role="status">把一隻手放入框內，掌心朝鏡頭。</p>
</aside>
<div id="controls">
  <button id="camera" disabled>開始體驗</button>
  <button id="demo" disabled>觀看示範</button>
  <button id="replay" hidden>觀看完整歷程回放</button>
  <button id="stop" hidden>停止鏡頭</button>
  <button id="fs">全螢幕</button>
</div>
<small id="privacy">不顯示鏡頭原圖 · 影像只在本機分析，不上傳或儲存</small>
<output id="debug" hidden></output>
<noscript>此互動體驗需要 JavaScript。請啟用後重新載入。</noscript>
<script type="module">
import('./app.mjs?v=5').catch(error => {
  console.error(error);
  document.getElementById('headline').textContent='未能啟動立體畫面';
  document.getElementById('message').textContent='請使用支援 WebGL 的瀏覽器，並重新載入頁面。';
});
</script>
</body>
</html>
