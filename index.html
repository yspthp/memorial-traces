<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172122">
<link rel="icon" href="data:,">
<title>被紀念的痕跡 · 石膏掌印</title>
<style>
  :root{color-scheme:dark;--ink:#f1ecdf;--muted:#b5bcb6}
  *{box-sizing:border-box}body{margin:0;background:#172122;color:var(--ink);font-family:"Noto Serif TC","Songti TC",serif}
  #gl{position:fixed;inset:0}#gl canvas{display:block;width:100%;height:100%}
  header{position:fixed;top:26px;left:32px;pointer-events:none}header p{margin:0 0 9px;font:10px/1.4 system-ui;letter-spacing:.28em;color:var(--muted)}
  h1{font-size:18px;letter-spacing:.23em;font-weight:400;margin:0}
  #mode{position:fixed;right:30px;top:30px;font:11px system-ui;color:var(--muted);letter-spacing:.1em}
  #copy{position:fixed;bottom:100px;left:8%;right:8%;text-align:center;pointer-events:none}
  h2{font-size:clamp(20px,3.2vw,31px);font-weight:400;letter-spacing:.14em;margin:0 0 12px}
  #message{font-size:clamp(13px,1.7vw,17px);line-height:1.8;letter-spacing:.06em;color:var(--muted);margin:0;min-height:2em}
  #controls{position:fixed;bottom:28px;left:0;right:0;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
  button{font-size:12px;line-height:1.4;font-family:inherit;letter-spacing:.08em;border:1px solid #aebbb34d;background:#152021c9;color:var(--ink);padding:10px 17px;border-radius:24px;cursor:pointer}
  button:hover{background:#344143}button:focus-visible{outline:2px solid #eee3cb;outline-offset:4px}button:disabled{opacity:.5;cursor:wait}
  #camera{background:#eee5d3;color:#293230;border-color:#eee5d3}
  #meter{width:140px;height:2px;background:#ffffff20;margin:15px auto 0}#bar{height:100%;background:#e8d9b8;width:0%;transition:width .15s}
  #preview-panel{position:fixed;bottom:130px;left:24px;width:240px;border:1px solid #d8dec447;border-radius:10px;background:#132021;overflow:hidden}
  #preview{display:block;width:100%;height:auto}
  #tracking-status{margin:8px 10px;font:12px/1.6 system-ui;color:#d7e7df}
  #preview-panel::before{content:"只顯示手部辨識結果";display:block;padding:7px 10px;background:#0e1718;color:#9db4aa;font:10px system-ui;letter-spacing:.08em}
  #privacy{position:fixed;left:24px;bottom:8px;font:10px system-ui;color:#93a39c}
  #debug{position:fixed;top:90px;left:24px;font:11px monospace;color:#c6d6b6}
  [hidden]{display:none!important}
  @media(max-width:600px){header{top:20px;left:20px}h1{font-size:15px}#mode{top:24px;right:18px;font-size:10px}#copy{bottom:125px;left:6%;right:6%}#controls{bottom:40px;gap:6px}button{padding:9px 10px;font-size:11px}#preview-panel{width:144px;left:12px;top:84px;bottom:auto}#tracking-status{font-size:10px;margin:5px 7px}#privacy{left:0;right:0;text-align:center}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script type="importmap">{"imports":{"three":"./assets/vendor/three.module.js"}}</script>
</head>
<body>
<main id="gl" aria-label="立體石膏板，手印直接凹入表面"></main>
<header><p>MEMORIAL TRACES / 被珍藏的印記</p><h1>被紀念的痕跡</h1></header>
<div id="mode">掌形預覽 · v4.1</div>
<section id="copy" aria-live="polite" aria-atomic="true">
  <h2 id="headline">每一道痕跡，都值得被留下。</h2>
  <p id="message">正在準備石膏表面…</p>
  <div id="meter" hidden><div id="bar"></div></div>
</section>
<aside id="preview-panel" hidden>
  <canvas id="preview" aria-label="只顯示手部辨識結果；綠色掌形代表姿勢適合，黃色代表需要調整"></canvas>
  <p id="tracking-status" role="status">把一隻手放入框內，掌心朝鏡頭。</p>
</aside>
<div id="controls">
  <button id="camera" disabled>開始鏡頭體驗</button>
  <button id="demo" disabled>觀看示範</button>
  <button id="replay" hidden>重播顯影</button>
  <button id="stop" hidden>停止鏡頭</button>
  <button id="fs">全螢幕</button>
</div>
<small id="privacy">不顯示鏡頭原圖 · 影像只在本機分析，不上傳或儲存</small>
<output id="debug" hidden></output>
<noscript>此互動體驗需要 JavaScript。請啟用後重新載入。</noscript>
<script type="module">
import('./app.mjs?v=4.1').catch(error => {
  console.error(error);
  document.getElementById('headline').textContent='未能啟動立體畫面';
  document.getElementById('message').textContent='請使用支援 WebGL 的瀏覽器，並重新載入頁面。';
});
</script>
</body>
</html>
