<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172122">
<link rel="icon" href="data:,">
<title>《被紀念的痕跡》</title>
<style>
  :root{color-scheme:dark;--ink:#f1ecdf;--muted:#b5bcb6;--crimson:#d96b62;--gold:#ebdca8;--emerald:#71f0bc}
  *{box-sizing:border-box}
  body{margin:0;background:#172122;color:var(--ink);font-family:"Noto Serif TC","Songti TC",serif;transition:background-color 1.5s ease}
  body.grace-perspective{background:#1c2423}

  /* 3D 畫布與各階段濾鏡／徒勞消退／視角切換 1.5s 轉場動畫 */
  #gl{position:fixed;inset:0;transition:filter 1.5s cubic-bezier(.22,1,.36,1),transform 1.5s cubic-bezier(.22,1,.36,1)}
  #gl canvas{display:block;width:100%;height:100%}
  body[data-stage="READY"] #gl,body[data-stage="CAPTURE"] #gl{filter:grayscale(.72) contrast(1.06) brightness(.92)}
  body[data-stage="LOSS"] #gl{filter:grayscale(.85) contrast(.96) brightness(.84);animation:effortFutilityFade 3s cubic-bezier(.4,0,.2,1) forwards}
  body[data-stage="INVITE"] #gl{filter:grayscale(0) sepia(.18) contrast(1.06) brightness(1.02);animation:perspectiveCameraShift 1.5s cubic-bezier(.22,1,.36,1) forwards}
  body[data-stage="REVEAL"] #gl,body[data-stage="END"] #gl{filter:grayscale(0) contrast(1.06) brightness(1.05)}

  @keyframes effortFutilityFade{
    0%{opacity:1;filter:grayscale(.35) contrast(1.08) brightness(.96)}
    25%{opacity:.86;filter:grayscale(.6) contrast(1.02) brightness(.88)}
    55%{opacity:.92;filter:grayscale(.75) contrast(.98) brightness(.85)}
    100%{opacity:1;filter:grayscale(.88) contrast(.94) brightness(.82)}
  }

  @keyframes perspectiveCameraShift{
    0%{filter:grayscale(.88) contrast(.94) brightness(.72);transform:scale(.985)}
    50%{filter:grayscale(.2) sepia(.28) contrast(1.08) brightness(1.06);transform:scale(1.008)}
    100%{filter:grayscale(0) sepia(.14) contrast(1.05) brightness(1.02);transform:scale(1)}
  }

  /* 階段三：1.5 秒邊緣光暈泛入與視角濾鏡過場層 */
  #perspective-veil{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 48%,rgba(235,220,168,.16) 0%,rgba(235,220,168,.06) 45%,rgba(8,14,15,.72) 100%);box-shadow:inset 0 0 0 rgba(235,220,168,0);transition:opacity 1.5s ease,box-shadow 1.5s ease;z-index:1}
  #perspective-veil.active{opacity:1;box-shadow:inset 0 0 130px rgba(235,220,168,.34);animation:perspectiveHaloIn 1.5s cubic-bezier(.22,1,.36,1) forwards}
  @keyframes perspectiveHaloIn{
    0%{opacity:0;backdrop-filter:blur(0px) grayscale(1);box-shadow:inset 0 0 0 rgba(235,220,168,0)}
    45%{opacity:.95;backdrop-filter:blur(3px) grayscale(.3);box-shadow:inset 0 0 160px rgba(235,220,168,.42)}
    100%{opacity:.48;backdrop-filter:blur(0px) grayscale(0);box-shadow:inset 0 0 110px rgba(235,220,168,.26)}
  }

  /* 階段一與階段三：手掌輪廓引導框 */
  #palm-guide{position:fixed;top:44%;left:50%;transform:translate(-50%,-50%);width:clamp(180px,28vmin,260px);height:clamp(220px,34vmin,320px);border:1.5px dashed rgba(241,236,223,.38);border-radius:46% 46% 38% 38%;pointer-events:none;z-index:2;display:flex;align-items:center;justify-content:center;transition:border-color .8s ease,box-shadow .8s ease,opacity .6s ease}
  #palm-guide::after{content:"";width:72%;height:76%;border:1px solid rgba(241,236,223,.22);border-radius:48% 48% 40% 40%}
  #palm-guide[data-guide-mode="gentle"]{border-color:rgba(235,220,168,.62);box-shadow:0 0 32px rgba(235,220,168,.22)}

  /* 1. Header / Logo 區域強制清理：單一活動名稱《被紀念的痕跡》與 Flexbox 對齊佈局 */
  header{position:fixed;top:0;left:0;right:0;height:72px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;pointer-events:none;z-index:3}
  header h1{font-size:20px;line-height:1;letter-spacing:.22em;font-weight:400;margin:0}
  #mode{font:11px/1 system-ui;color:var(--muted);letter-spacing:.1em;margin:0}

  /* 文案與階段二 3s 延遲、階段四 3.5s+ 強制停留動畫 */
  #copy{position:fixed;bottom:98px;left:8%;right:8%;text-align:center;pointer-events:none;z-index:3}
  h2{font-size:clamp(20px,3.1vw,30px);font-weight:400;letter-spacing:.12em;margin:0 0 12px;transition:opacity .9s ease}
  body[data-stage="LOSS"] h2{transition:opacity 1.1s ease 3s}
  body[data-stage="REVEAL"] h2{animation:graceSteadyHold 3.8s ease forwards}
  @keyframes graceSteadyHold{
    0%{opacity:0;transform:translateY(6px)}
    18%{opacity:1;transform:translateY(0)}
    100%{opacity:1;transform:translateY(0)}
  }
  #message{font-size:clamp(13px,1.7vw,17px);line-height:1.8;letter-spacing:.06em;color:var(--muted);margin:0;min-height:1.8em;transition:opacity .9s ease}
  #message strong{color:var(--ink);font-weight:600}
  #scripture{margin:14px auto 0;max-width:680px;padding:12px 20px;border-top:1px solid rgba(235,220,168,.28);font-size:clamp(13px,1.55vw,16px);line-height:1.85;letter-spacing:.08em;color:#e7dec8;background:rgba(15,23,24,.72);border-radius:8px;transition:opacity 1.1s ease .4s}

  /* 階段五：完整歷程分割畫面與關鍵截圖對比回放 */
  #journey-replay{position:fixed;top:76px;left:50%;transform:translateX(-50%);display:flex;gap:16px;padding:12px 16px;background:rgba(14,22,23,.88);border:1px solid rgba(235,220,168,.32);border-radius:14px;z-index:4;backdrop-filter:blur(6px)}
  .replay-card{width:clamp(135px,22vw,190px);text-align:center;padding:8px;border-radius:10px;border:1px solid rgba(255,255,255,.08);transition:border-color .4s ease,transform .4s ease,box-shadow .4s ease}
  .replay-card.active{border-color:rgba(235,220,168,.75);box-shadow:0 0 18px rgba(235,220,168,.18);transform:translateY(-2px)}
  .replay-card canvas{width:100%;height:auto;border-radius:6px;display:block;margin-bottom:6px;background:#132021}
  .replay-card span{display:block;font:11px/1.4 system-ui;color:var(--muted);letter-spacing:.06em}

  #controls{position:fixed;bottom:26px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;z-index:4}
  button{font-size:12px;line-height:1.4;font-family:inherit;letter-spacing:.08em;border:1px solid #aebbb34d;background:#152021c9;color:var(--ink);padding:10px 18px;border-radius:24px;cursor:pointer}
  button:hover{background:#344143}button:focus-visible{outline:2px solid #eee3cb;outline-offset:4px}button:disabled{opacity:.5;cursor:wait}
  #camera,#replay{background:#eee5d3;color:#293230;border-color:#eee5d3}
  #meter{width:140px;height:2px;background:#ffffff20;margin:15px auto 0}
  #bar{height:100%;background:var(--crimson);width:0%;transition:width .18s ease}

  /* 4. 鏡頭預覽面板與階段五「印記已保存」發光邊框及打勾 Overlay */
  #preview-panel{position:fixed;bottom:130px;left:24px;width:240px;border:1px solid #d8dec447;border-radius:10px;background:#132021;overflow:hidden;z-index:3;transition:border-color .6s ease,box-shadow .6s ease}
  #preview-panel.saved-complete,body[data-stage="END"] #preview-panel{border-color:var(--gold);box-shadow:0 0 22px rgba(235,220,168,.38),inset 0 0 12px rgba(113,240,188,.18)}
  #preview-wrap{position:relative;width:100%}
  #preview{display:block;width:100%;height:auto}
  #preview-complete-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(14,23,24,.78);backdrop-filter:blur(2px);color:var(--ink);text-align:center;padding:12px;animation:overlayFadeIn .6s ease forwards}
  .check-badge{width:38px;height:38px;border-radius:50%;border:2px solid var(--emerald);background:rgba(113,240,188,.16);color:var(--emerald);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;box-shadow:0 0 16px rgba(113,240,188,.35)}
  .overlay-label{font:12px/1.5 system-ui;color:#f1ecdf;letter-spacing:.08em}
  @keyframes overlayFadeIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}

  #tracking-status{margin:8px 10px;font:12px/1.6 system-ui;color:#d7e7df}
  #preview-panel::before{content:"只顯示手部辨識結果";display:block;padding:7px 10px;background:#0e1718;color:#9db4aa;font:10px system-ui;letter-spacing:.08em}
  #privacy{position:fixed;left:24px;bottom:8px;font:10px system-ui;color:#93a39c;z-index:3}
  #debug{position:fixed;top:90px;left:24px;font:11px monospace;color:#c6d6b6;z-index:4}
  [hidden]{display:none!important}
  @media(max-width:600px){header{height:56px;padding:0 20px}header h1{font-size:16px}#mode{font-size:10px}#copy{bottom:118px;left:6%;right:6%}#controls{bottom:36px;gap:6px}button{padding:9px 12px;font-size:11px}#preview-panel{width:152px;left:12px;top:64px;bottom:auto}#tracking-status{font-size:10px;margin:5px 7px}#journey-replay{top:62px;gap:8px;padding:8px}#privacy{left:0;right:0;text-align:center}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body data-stage="HOME">
<main id="gl" aria-label="立體石膏板，手印直接凹入表面"></main>
<div id="perspective-veil" aria-hidden="true"></div>
<div id="palm-guide" hidden aria-hidden="true"></div>
<header>
  <h1>《被紀念的痕跡》</h1>
  <div id="mode">力度測試 · 階段一</div>
</header>
<section id="copy" aria-live="polite" aria-atomic="true">
  <h2 id="headline">留下你的痕跡</h2>
  <p id="message">這是一個關於你存在的測試。請將手掌貼近鏡頭，並<strong>盡你所能，用力按壓</strong>。</p>
  <blockquote id="scripture" hidden>我未成形的體質，你的眼早已看見了；你所定的日子，我尚未度一日，都在你的冊子寫上了。（詩篇 139:16）</blockquote>
  <div id="meter" hidden><div id="bar"></div></div>
</section>
<section id="journey-replay" hidden aria-label="完整歷程對比回放">
  <div class="replay-card" id="replay-card-effort">
    <canvas id="replay-effort-canvas" width="160" height="160"></canvas>
    <span>階段二：用力按壓（逐漸消退）</span>
  </div>
  <div class="replay-card" id="replay-card-grace">
    <canvas id="replay-grace-canvas" width="160" height="160"></canvas>
    <span>階段四：輕輕放置（永恆印記）</span>
  </div>
</section>
<aside id="preview-panel" hidden>
  <div id="preview-wrap">
    <canvas id="preview" aria-label="只顯示手部辨識結果；綠色掌形代表姿勢適合，黃色代表需要調整"></canvas>
    <div id="preview-complete-overlay" hidden role="status" aria-live="polite">
      <div class="check-badge" aria-hidden="true">✓</div>
      <div class="overlay-label">印記已保存 · 你可以放手了</div>
    </div>
  </div>
  <p id="tracking-status" role="status">把一隻手放入框內，掌心朝鏡頭。</p>
</aside>
<div id="controls">
  <button id="camera" disabled>開始體驗</button>
  <button id="demo" disabled>觀看示範</button>
  <button id="stop" hidden>停止鏡頭</button>
  <button id="fs">全螢幕</button>
</div>
<small id="privacy">不顯示鏡頭原圖 · 影像只在本機分析，不上傳或儲存</small>
<output id="debug" hidden></output>
<noscript>此互動體驗需要 JavaScript。請啟用後重新載入。</noscript>
<script type="module">
import('./app.mjs?v=5.1').catch(error => {
  console.error(error);
  document.getElementById('headline').textContent='未能啟動立體畫面';
  document.getElementById('message').textContent='請使用支援 WebGL 的瀏覽器，並重新載入頁面。';
});
</script>
</body>
</html>
