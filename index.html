<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>被紀念的痕跡</title>
<style>
  :root{--ink:#f3ead9;--dim:rgba(243,234,217,.62);--bg:#050302}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);color:var(--ink);
    font-family:"Noto Serif TC","Songti TC",serif;overflow:hidden}
  /* 獨立渲染層：不受任何文字階層透明度影響 */
  #gl{position:fixed;inset:0;z-index:1}
  #gl canvas{display:block;width:100%;height:100%}
  .stage{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;opacity:0;
    transition:opacity 1.4s ease;pointer-events:none;padding:6vmin}
  .stage.on{opacity:1}
  h1{font-size:clamp(28px,6vmin,64px);font-weight:600;letter-spacing:.35em;
    text-indent:.35em;margin-bottom:4vmin}
  .line{font-size:clamp(18px,3.6vmin,34px);line-height:1.9;letter-spacing:.22em;color:var(--dim)}
  .line.strong{color:var(--ink)}
  .line.small{font-size:clamp(13px,2.2vmin,20px);margin-top:2vmin;letter-spacing:.3em}
  /* 固定閱讀區在下方：文字不壓住碑面與掌印 */
  .read{position:fixed;left:0;right:0;bottom:7vmin;z-index:3;display:flex;flex-direction:column;
    align-items:center;gap:1.2vmin;opacity:0;transition:opacity 1.2s ease;
    pointer-events:none;padding:0 8vmin;text-align:center}
  .read.on{opacity:1}
  #op{position:fixed;top:10px;left:12px;z-index:9;font-size:11px;
    color:rgba(243,234,217,.35);letter-spacing:.08em;font-family:ui-monospace,monospace}
  #fs{position:fixed;right:14px;bottom:12px;z-index:9;background:none;
    border:1px solid rgba(243,234,217,.25);color:var(--dim);padding:6px 14px;
    font:inherit;font-size:12px;letter-spacing:.2em;cursor:pointer;border-radius:2px}
  #fs:hover{color:var(--ink);border-color:rgba(243,234,217,.5)}
  .dots::after{content:"…";animation:p 1.6s infinite}
  @keyframes p{0%,100%{opacity:.2}50%{opacity:1}}
  #dbg{position:fixed;left:12px;bottom:12px;z-index:9;display:none;
    background:rgba(0,0,0,.55);padding:6px;border:1px solid rgba(243,234,217,.2)}
  body.debug #dbg{display:block}
</style>
<script type="importmap">
{ "imports":{ "three":"./assets/vendor/three.module.js" } }
</script>
</head>
<body>
  <div id="gl"></div>

  <div class="stage" id="s-title"><h1>被紀念的痕跡</h1>
    <div class="line dots" id="cal-line">正在感受現場的溫度</div></div>
  <div class="stage" id="s-ready"><h1>被紀念的痕跡</h1>
    <div class="line">請將手掌放入鏡頭範圍</div></div>
  <div class="stage" id="s-effort">
    <div class="line strong">請將手掌放下。用力一點。維持三秒。</div>
    <div class="line small">張開五指，讓痕跡完整。</div></div>
  <div class="stage" id="s-loss">
    <div class="line">這麼用力，卻只有留下淡淡的痕跡嗎？</div></div>
  <div class="stage" id="s-invite2">
    <div class="line">現在，再將手掌輕輕放上去一次。<br>不需要用力。</div></div>
  <div class="read" id="s-reveal">
    <div class="line strong">你一直被看見。</div>
    <div class="line">你的每一個痕跡，在神眼中都是最寶貴的。</div></div>

  <div id="op"></div>
  <canvas id="dbg" width="340" height="270"></canvas>
  <button id="fs">全螢幕</button>

<script type="module">
/* 《被紀念的痕跡》 deploy 最終版 —— 純客戶端：webcam 暗場採集 + 即時高度場掌印
   無後端、無資料庫；畫面僅在頁內處理、即用即棄。
   路徑全相對：可部署於網域根或 GitHub Pages 子路徑。 */

const el=id=>document.getElementById(id);
const opEl=el('op'); const setOp=t=>{opEl.textContent=t;};
const DEBUG=location.search.includes('debug=1');
if(DEBUG)document.body.classList.add('debug');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const clamp01=v=>clamp(v,0,1);
const ease=t=>t*t*(3-2*t);
const sstep=(a,b,x)=>{const t=clamp01((x-a)/(b-a));return t*t*(3-2*t);};
function fatal(msg){ setOp(msg);
  el('s-title').classList.add('on');
  el('cal-line').classList.remove('dots');
  el('cal-line').textContent=msg; }

/* Three.js 改為動態 import：載入失敗要有可見錯誤 */
let THREE;
try{ THREE=await import('three'); }
catch(e){ fatal('Three.js 載入失敗：請確認 assets/vendor/three.module.js 已上傳'); throw e; }

/* ================= 可調參數（現場旋鈕） ================= */
const K = {
  spanMin:0.12, tFrac:0.45, minArea:0.045,
  presentMs:600, absentMs:1500, calibMs:3000,
  lossMs:4000, revealMs:12000, fadeMs:3000,
  developMs:2600, effortMaxMs:12000, idleMs:60000,
  depth:0.16, rim:0.45, rough:0.10, glow:1.0
};
const PW=160, PH=120, HS=256;

/* ================= 相機採集 ================= */
const video=document.createElement('video');
video.setAttribute('playsinline',''); video.muted=true;
const pcan=document.createElement('canvas'); pcan.width=PW; pcan.height=PH;
const pctx=pcan.getContext('2d',{willReadFrequently:true});
const L=new Float32Array(PW*PH);
let camOK=false, camErr='';
async function startCamera(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{width:{ideal:1280},height:{ideal:720}}, audio:false});
    video.srcObject=stream; await video.play();
    try{ // 嘗試鎖曝光；鎖不了就靠每幀自動阈值吸收
      const tr=stream.getVideoTracks()[0], caps=tr.getCapabilities?.()||{};
      if(caps.exposureMode&&caps.exposureMode.includes('manual')){
        const adv=[{exposureMode:'manual'}];
        if(caps.exposureTime)adv.push({exposureTime:(caps.exposureTime.min+caps.exposureTime.max)/2});
        await tr.applyConstraints({advanced:adv});
        setOp('相機就緒（曝光已鎖）');
      } else setOp('相機就緒（自動阈值模式）');
    }catch{ setOp('相機就緒（自動阈值模式）'); }
    camOK=true;
  }catch(e){
    camOK=false; camErr='鏡頭無法啟動：'+(e.name||e.message)+
      (location.protocol==='http:'&&location.hostname!=='127.0.0.1'&&location.hostname!=='localhost'
       ? '（http 非 localhost 不放行相機，請用 https 或 127.0.0.1）':'');
    fatal(camErr);
  }
}
const hist=new Uint32Array(128);
function processFrame(){
  if(!camOK||video.readyState<2)return null;
  const vw=video.videoWidth||1280, vh=video.videoHeight||720;
  const sw=Math.min(vw,vh*4/3), sh=Math.min(vh,vw*3/4);   // 4:3 中心裁切，避免拉伸變形
  const sx=(vw-sw)/2, sy=(vh-sh)/2;
  pctx.setTransform(-1,0,0,1,PW,0);                        // 板下鏡像 → 水平 flip
  pctx.drawImage(video,sx,sy,sw,sh,0,0,PW,PH);
  pctx.setTransform(1,0,0,1,0,0);
  const d=pctx.getImageData(0,0,PW,PH).data;
  hist.fill(0);
  for(let i=0;i<PW*PH;i++){
    const v=(d[i*4]*.299+d[i*4+1]*.587+d[i*4+2]*.114)/255;
    L[i]=v; hist[Math.min(127,v*127|0)]++;
  }
  const n=PW*PH; let c=0, lo=0, hi=0;
  for(let b=0;b<128;b++){c+=hist[b]; if(c>=n*0.50){lo=b/127;break;}}
  c=0; for(let b=0;b<128;b++){c+=hist[b]; if(c>=n*0.995){hi=b/127;break;}}
  const span=hi-lo;
  if(span<K.spanMin)return{present:false,span,area:0};
  const T=lo+K.tFrac*span;
  const lab=new Int32Array(n).fill(-1); let best=-1,bestA=0;
  const stack=new Int32Array(n);
  for(let s=0;s<n;s++){
    if(L[s]<=T||lab[s]>=0)continue;
    let top=0; stack[top++]=s; lab[s]=0; let a=0;
    while(top){
      const i=stack[--top]; a++;
      const x=i%PW, y=i/PW|0;
      if(x>0&&L[i-1]>T&&lab[i-1]<0){lab[i-1]=0;stack[top++]=i-1;}
      if(x<PW-1&&L[i+1]>T&&lab[i+1]<0){lab[i+1]=0;stack[top++]=i+1;}
      if(y>0&&L[i-PW]>T&&lab[i-PW]<0){lab[i-PW]=0;stack[top++]=i-PW;}
      if(y<PH-1&&L[i+PW]>T&&lab[i+PW]<0){lab[i+PW]=0;stack[top++]=i+PW;}
    }
    if(a>bestA){bestA=a;best=s;}
  }
  if(bestA<n*K.minArea)return{present:false,span,area:bestA/n};
  const B=new Uint8Array(n);
  { let top=0; stack[top++]=best; B[best]=1;
    while(top){ const i=stack[--top], x=i%PW, y=i/PW|0;
      if(x>0&&L[i-1]>T&&!B[i-1]){B[i-1]=1;stack[top++]=i-1;}
      if(x<PW-1&&L[i+1]>T&&!B[i+1]){B[i+1]=1;stack[top++]=i+1;}
      if(y>0&&L[i-PW]>T&&!B[i-PW]){B[i-PW]=1;stack[top++]=i-PW;}
      if(y<PH-1&&L[i+PW]>T&&!B[i+PW]){B[i+PW]=1;stack[top++]=i+PW;} } }
  const out=new Uint8Array(n);
  { let top=0;
    const push=i=>{if(!out[i]&&!B[i]){out[i]=1;stack[top++]=i;}};
    for(let x=0;x<PW;x++){push(x);push((PH-1)*PW+x);}
    for(let y=0;y<PH;y++){push(y*PW);push(y*PW+PW-1);}
    while(top){ const i=stack[--top], x=i%PW, y=i/PW|0;
      if(x>0)push(i-1); if(x<PW-1)push(i+1);
      if(y>0)push(i-PW); if(y<PH-1)push(i+PW); } }
  let m=0,sl=0,sx2=0,sy2=0;
  const S=new Float32Array(n);
  for(let i=0;i<n;i++){ const v=(B[i]||!out[i])?1:0;
    if(v){m++;sl+=L[i];sx2+=i%PW;sy2+=(i/PW|0);} S[i]=v; }
  boxBlur(S,PW,PH,2);
  return{present:true,span,S,cx:sx2/m/PW,cy:sy2/m/PH,area:m/n,meanL:sl/m};
}
function boxBlur(src,w,h,r){
  const tmp=new Float32Array(w*h), win=2*r+1;
  for(let y=0;y<h;y++){const o=y*w; let s=0;
    for(let x=-r;x<=r;x++)s+=src[o+clamp(x,0,w-1)];
    for(let x=0;x<w;x++){tmp[o+x]=s/win;
      s+=src[o+clamp(x+r+1,0,w-1)]-src[o+clamp(x-r,0,w-1)];}}
  for(let x=0;x<w;x++){let s=0;
    for(let y=-r;y<=r;y++)s+=tmp[clamp(y,0,h-1)*w+x];
    for(let y=0;y<h;y++){src[y*w+x]=s/win;
      s+=tmp[clamp(y+r+1,0,h-1)*w+x]-tmp[clamp(y-r,0,h-1)*w+x];}}
}

/* ================= 高度場合成 ================= */
const ucan=document.createElement('canvas'); ucan.width=PW; ucan.height=PH;
const uctx=ucan.getContext('2d',{willReadFrequently:true});
const dcan=document.createElement('canvas'); dcan.width=HS; dcan.height=HS;
const dctx=dcan.getContext('2d',{willReadFrequently:true});
const NG=33, ngrid=new Float32Array(NG*NG);
for(let i=0;i<NG*NG;i++)ngrid[i]=Math.random();
function vnoise(x,y){
  const gx=x*(NG-1),gy=y*(NG-1),x0=gx|0,y0=gy|0,fx=gx-x0,fy=gy-y0;
  const x1=Math.min(NG-1,x0+1),y1=Math.min(NG-1,y0+1);
  const sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
  const a=ngrid[y0*NG+x0],b=ngrid[y0*NG+x1],c=ngrid[y1*NG+x0],e=ngrid[y1*NG+x1];
  const t=a+(b-a)*sx, u=c+(e-c)*sx; return t+(u-t)*sy;
}
function distTransform(mask,w,h){
  const INF=1e9,d=new Float32Array(w*h);
  for(let i=0;i<w*h;i++)d[i]=mask[i]>0.5?INF:0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;let v=d[i];
    if(x>0)v=Math.min(v,d[i-1]+1); if(y>0)v=Math.min(v,d[i-w]+1);
    if(x>0&&y>0)v=Math.min(v,d[i-w-1]+1.4142);
    if(x<w-1&&y>0)v=Math.min(v,d[i-w+1]+1.4142); d[i]=v;}
  for(let y=h-1;y>=0;y--)for(let x=w-1;x>=0;x--){const i=y*w+x;let v=d[i];
    if(x<w-1)v=Math.min(v,d[i+1]+1); if(y<h-1)v=Math.min(v,d[i+w]+1);
    if(x<w-1&&y<h-1)v=Math.min(v,d[i+w+1]+1.4142);
    if(x>0&&y<h-1)v=Math.min(v,d[i+w-1]+1.4142); d[i]=v;}
  return d;
}
let Hsharp=null,Hblur=null,Hcur=null,htex;
function makeHTex(){
  htex=new THREE.DataTexture(new Uint8Array(HS*HS*4),HS,HS,THREE.RGBAFormat,THREE.UnsignedByteType);
  htex.magFilter=THREE.LinearFilter; htex.minFilter=THREE.LinearFilter;
  htex.wrapS=htex.wrapT=THREE.ClampToEdgeWrapping; htex.needsUpdate=true;
}
function writeHTex(H){
  const b=htex.image.data;
  for(let i=0;i<HS*HS;i++){const v=H[i]*255;
    b[i*4]=b[i*4+1]=b[i*4+2]=v; b[i*4+3]=255;}
  htex.needsUpdate=true;
}
function buildImprint(burn){
  const img=uctx.createImageData(PW,PH);
  for(let i=0;i<PW*PH;i++){const v=clamp01(burn[i])*255;
    img.data[i*4]=img.data[i*4+1]=img.data[i*4+2]=v; img.data[i*4+3]=255;}
  uctx.putImageData(img,0,0);
  dctx.imageSmoothingEnabled=true; dctx.drawImage(ucan,0,0,HS,HS);
  const px=dctx.getImageData(0,0,HS,HS).data;
  const M=new Float32Array(HS*HS);
  for(let y=0;y<HS;y++)for(let x=0;x<HS;x++){
    const u=x/HS,v=y/HS;
    const w=sstep(0,.10,u)*sstep(0,.10,1-u)*sstep(0,.10,v)*sstep(0,.10,1-v);
    M[y*HS+x]=sstep(.22,.60,px[(y*HS+x)*4]/255)*w;
  }
  const dt=distTransform(M,HS,HS);
  let dmax=0; for(let i=0;i<HS*HS;i++)if(M[i]>0.5&&dt[i]>dmax)dmax=dt[i];
  const dome=new Float32Array(HS*HS);
  for(let i=0;i<HS*HS;i++)dome[i]=dmax?clamp01(dt[i]/dmax)*M[i]:0;
  boxBlur(dome,HS,HS,3);
  const Mb=new Float32Array(M); boxBlur(Mb,HS,HS,4);
  const Mb2=new Float32Array(M); boxBlur(Mb2,HS,HS,2);
  Hsharp=new Float32Array(HS*HS); Hblur=new Float32Array(HS*HS); Hcur=new Float32Array(HS*HS);
  for(let y=0;y<HS;y++)for(let x=0;x<HS;x++){
    const i=y*HS+x;
    const rim=clamp01(Mb[i]-M[i]);
    const gx=Math.abs(Mb2[i+1>HS*HS-1?i:i+1]-Mb2[i-1<0?i:i-1]);
    const gy=Math.abs(Mb2[i+HS>HS*HS-1?i:i+HS]-Mb2[i-HS<0?i:i-HS]);
    const edge=clamp01((gx+gy)*3);
    const nz=(vnoise(x/HS,y/HS)-0.5)*2;
    Hsharp[i]=clamp01(dome[i]+rim*K.rim+nz*edge*K.rough);
  }
  Hblur.set(Hsharp); boxBlur(Hblur,HS,HS,6);
  Hcur.set(Hblur); writeHTex(Hcur);
}

/* ================= 石膏晶粒法線（程序化材質感） ================= */
function plasterNormal(){
  const S=256,c=document.createElement('canvas');c.width=c.height=S;
  const cc=c.getContext('2d'),img=cc.createImageData(S,S);
  const h=new Float32Array(S*S);
  for(let i=0;i<S*S;i++)h[i]=Math.random();
  boxBlur(h,S,S,1);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const i=y*S+x;
    const dx=h[y*S+((x+1)%S)]-h[y*S+((x-1+S)%S)];
    const dy=h[((y+1)%S)*S+x]-h[((y-1+S)%S)*S+x];
    const len=Math.hypot(dx*2.2,dy*2.2,1);
    img.data[i*4]=((-dx*2.2/len)*.5+.5)*255;
    img.data[i*4+1]=((-dy*2.2/len)*.5+.5)*255;
    img.data[i*4+2]=((1/len)*.5+.5)*255;
    img.data[i*4+3]=255;
  }
  cc.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(3,3);
  return t;
}

/* ================= 3D 場景 ================= */
let renderer,scene,camera,plaqueGroup,imprint,imprintMat,motes,faceZ=0;
async function init3D(){
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.setClearColor(0x050302,1);
  el('gl').appendChild(renderer.domElement);
  scene=new THREE.Scene(); scene.fog=new THREE.FogExp2(0x050302,.045);
  camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,50);
  camera.position.set(0,0,3.6);
  scene.add(new THREE.AmbientLight(0x2a2018,.55));
  const key=new THREE.DirectionalLight(0xffd9a0,1.7); key.position.set(4,1.6,2.2); scene.add(key); // 側光：浮雕靈魂
  const rim=new THREE.DirectionalLight(0x6688ff,.35); rim.position.set(-3,2,-2); scene.add(rim);
  motes=makeMotes(); scene.add(motes);
  plaqueGroup=new THREE.Group(); scene.add(plaqueGroup);
  makeHTex();
  const grain=plasterNormal();
  const plaque=await loadPlaque(grain);
  plaqueGroup.add(plaque);
  faceZ=new THREE.Box3().setFromObject(plaque).max.z;
  imprintMat=new THREE.MeshStandardMaterial({color:0xE9DCC6,roughness:.92,metalness:0,
    transparent:true,opacity:0,displacementMap:htex,displacementScale:0,
    emissive:0xff8a4a,emissiveIntensity:0,emissiveMap:htex,
    normalMap:grain,normalScale:new THREE.Vector2(.35,.35),
    polygonOffset:true,polygonOffsetFactor:-2});
  imprint=new THREE.Mesh(new THREE.PlaneGeometry(1,1,200,200),imprintMat);
  imprint.position.z=faceZ+0.015; imprint.visible=false;
  plaqueGroup.add(imprint);
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);});
}
async function loadPlaque(grain){
  let GLTFLoader;
  try{ ({GLTFLoader}=await import('./assets/vendor/loaders/GLTFLoader.js')); }
  catch{ setOp('缺 GLTFLoader.js → 使用程序化空白碑'); return proceduralPlaque(grain); }
  try{
    const g=await new GLTFLoader().loadAsync('./assets/models/plaque.glb');
    const root=g.scene;
    /* 統一碑身材質：與印子層同色同質感，避免色差圈 */
    root.traverse(o=>{ if(o.isMesh) o.material=new THREE.MeshStandardMaterial(
      {color:0xE4D8C2,roughness:.95,metalness:0,
       normalMap:grain,normalScale:new THREE.Vector2(.35,.35)}); });
    /* 立起碑面：Meshy 模型預設於 X-Z 平面水平平躺，繞 X 軸轉 -90 度豎立起來正面朝向鏡頭 */
    root.rotation.x = -Math.PI / 2;
    root.updateMatrixWorld(true);
    const bb=new THREE.Box3().setFromObject(root);
    const size=bb.getSize(new THREE.Vector3()).length()||1;
    root.position.sub(bb.getCenter(new THREE.Vector3()));
    const wrap=new THREE.Group(); wrap.add(root); wrap.scale.setScalar(2.3/size);
    setOp('已載入正式 plaque.glb（已立起面向鏡頭）'); return wrap;
  }catch{ setOp('尚無 plaque.glb → 使用程序化空白碑'); return proceduralPlaque(grain); }
}
function proceduralPlaque(grain){
  const s=1.15,r=.14,shape=new THREE.Shape();
  shape.moveTo(-s+r,-s); shape.lineTo(s-r,-s); shape.quadraticCurveTo(s,-s,s,-s+r);
  shape.lineTo(s,s-r); shape.quadraticCurveTo(s,s,s-r,s);
  shape.lineTo(-s+r,s); shape.quadraticCurveTo(-s,s,-s,s-r);
  shape.lineTo(-s,-s+r); shape.quadraticCurveTo(-s,-s,-s+r,-s);
  const geo=new THREE.ExtrudeGeometry(shape,{depth:.16,bevelEnabled:true,
    bevelThickness:.03,bevelSize:.03,bevelSegments:4,curveSegments:24});
  geo.translate(0,0,-.08);
  return new THREE.Mesh(geo,new THREE.MeshStandardMaterial(
    {color:0xE4D8C2,roughness:.95,metalness:0,
     normalMap:grain,normalScale:new THREE.Vector2(.35,.35)}));
}
function makeMotes(){
  const n=220,p=new Float32Array(n*3);
  for(let i=0;i<n;i++){p[i*3]=(Math.random()-.5)*9;p[i*3+1]=(Math.random()-.5)*7;p[i*3+2]=(Math.random()-.5)*5;}
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(p,3));
  return new THREE.Points(g,new THREE.PointsMaterial({color:0xffc27a,size:.035,
    transparent:true,opacity:.18,depthWrite:false,blending:THREE.AdditiveBlending}));
}

/* ================= 狀態機（獨立時鐘） ================= */
const stages={title:el('s-title'),ready:el('s-ready'),effort:el('s-effort'),
  loss:el('s-loss'),invite2:el('s-invite2')}, revealEl=el('s-reveal');
let state='BOOT', tEnter=performance.now();
let calEmptyAt=null,presentAt=null,absentAt=null,confirmedAbsent=false;
let lastPresentAt=performance.now();
let burn=null, entryArea=0, maxArea=0, holdStart=0, force=0;
let artAngle=0, impOX=0, impOY=0, impScale=1, develop=0, fadeP=0;
let ghostOn=false, frameDt=16.7;
function setStage(n){for(const k in stages)stages[k].classList.toggle('on',k===n);
  revealEl.classList.toggle('on',n==='reveal'); revealEl.style.opacity='';}
function goto(s,now){state=s; tEnter=now; presentAt=null; absentAt=null;}
function startRound(now){burn=null; develop=0; fadeP=0; force=0; ghostOn=false;
  confirmedAbsent=false; calEmptyAt=null;
  if(imprint){imprint.visible=false; imprintMat.opacity=0;
    imprintMat.emissiveIntensity=0; imprintMat.displacementScale=0;}
  goto('CALIBRATE',now);}
function finishEffort(now){
  const hold01=clamp01((now-holdStart)/3000);
  const grow=entryArea>0?clamp01((maxArea/entryArea-1)/.30):0;
  force=clamp01(grow*.6+hold01*.4);
  if(burn)buildImprint(burn);
}
function showGhost(){
  if(ghostOn||!imprint||!Hsharp)return;
  ghostOn=true;
  imprint.visible=true;
  imprint.position.set(impOX,impOY,faceZ+0.015);
  imprint.scale.setScalar(impScale*1.9);
  imprintMat.opacity=.28;
  imprintMat.displacementScale=K.depth*.18*(0.55+0.45*force);
  imprintMat.emissiveIntensity=0;
  Hcur.set(Hblur); writeHTex(Hcur);
}
function beginReveal(){develop=0; ghostOn=false; imprint.visible=true;
  imprint.position.set(impOX,impOY,faceZ+0.015);
  imprint.scale.setScalar(impScale*1.9);
  Hcur.set(Hblur); writeHTex(Hcur);}
function applyDevelop(present){
  develop=clamp01(develop+(present?1:(1/3))*(frameDt/K.developMs));
  const q=ease(clamp01(develop*1.15));
  for(let i=0;i<HS*HS;i++)Hcur[i]=Hblur[i]+(Hsharp[i]-Hblur[i])*q;
  writeHTex(Hcur);
  imprintMat.opacity=1;
  imprintMat.displacementScale=K.depth*(0.18+0.82*ease(develop))*(0.55+0.45*force);
  imprintMat.emissiveIntensity=K.glow*(0.35+0.65*force)*ease(develop);
  motes.material.opacity=.18+.42*ease(develop);
}
function step(now,det){
  const fresh=!!det, present=fresh&&det.present;
  if(present)lastPresentAt=now;
  switch(state){
    case 'CALIBRATE': setStage('title');
      if(!fresh){calEmptyAt=null;break;}
      if(present)calEmptyAt=null;
      else{calEmptyAt??=now; if(now-calEmptyAt>=K.calibMs)goto('READY',now);}
      break;
    case 'READY': setStage('ready');
      if(now-lastPresentAt>K.idleMs){startRound(now);break;}
      if(!fresh){presentAt=null;break;}
      if(present){presentAt??=now; if(now-presentAt>=K.presentMs){
        burn=new Float32Array(PW*PH); entryArea=det.area; maxArea=det.area;
        holdStart=now; goto('EFFORT',now);}}
      else presentAt=null;
      break;
    case 'EFFORT': setStage('effort');
      if(!fresh){absentAt=null;break;}
      if(present){
        presentAt??=now; absentAt=null;
        maxArea=Math.max(maxArea,det.area);
        artAngle=(det.cx-.5)*1.1;
        impOX=clamp((det.cx-.5)*1.1,-.45,.45);
        impOY=clamp((.5-det.cy)*.9,-.45,.45);
        impScale=clamp(.75+(det.area-.10)/.20*.40,.75,1.15);
        for(let i=0;i<PW*PH;i++)if(det.S[i]>burn[i])burn[i]=det.S[i]; // 燒錄
        if(now-holdStart>K.effortMaxMs){finishEffort(now);goto('LOSS',now);}
      }else{
        presentAt=null; absentAt??=now;
        if(now-absentAt>=K.absentMs){finishEffort(now);goto('LOSS',now);}
      }
      break;
    case 'LOSS': setStage('loss'); showGhost();
      if(now-tEnter>=K.lossMs){confirmedAbsent=false;goto('INVITE2',now);}
      break;
    case 'INVITE2': setStage('invite2'); showGhost();
      if(now-lastPresentAt>K.idleMs){startRound(now);break;}
      if(!fresh){presentAt=null;break;}
      if(!confirmedAbsent){if(!present)confirmedAbsent=true;}
      else if(present){presentAt??=now;
        if(now-presentAt>=K.presentMs){beginReveal();goto('REVEAL',now);}}
      else presentAt=null;
      break;
    case 'REVEAL': setStage('reveal'); applyDevelop(present);
      if(now-tEnter>=K.revealMs)goto('FADE',now);
      break;
    case 'FADE': setStage('reveal');
      fadeP=clamp01((now-tEnter)/K.fadeMs);
      imprintMat.opacity=1-fadeP;
      imprintMat.emissiveIntensity=K.glow*(1-fadeP)*(0.35+0.65*force)*ease(develop);
      motes.material.opacity=.18+.4*(1-fadeP)*develop;
      revealEl.style.opacity=String(1-fadeP);
      if(fadeP>=1)startRound(now);
      break;
  }
  if(DEBUG)drawDebug(det);
}

/* ================= 主迴圈（獨立時鐘 + 渲染） ================= */
let pClock=performance.now(), fps=60;
function tick(){
  requestAnimationFrame(tick);
  const now=performance.now(), dt=now-pClock; pClock=now;
  frameDt=Math.min(50,dt); fps+=((1000/Math.max(1,dt))-fps)*.05;
  const det=processFrame();
  if(state==='BOOT'&&camOK)startRound(now);
  if(!camOK)return;
  step(now,det);
  plaqueGroup.rotation.y+=(artAngle*.55-plaqueGroup.rotation.y)*.04;
  renderer.render(scene,camera);
  setOp(`${state} · fps ${fps|0} · area ${det&&det.area?(det.area*100).toFixed(1)+'%':'--'} · force ${force.toFixed(2)}`);
}

/* ================= debug 視圖（?debug=1） ================= */
const dbg=el('dbg'), gctx=dbg.getContext('2d');
const dbgA=document.createElement('canvas'); dbgA.width=PW; dbgA.height=PH;
const dbgB=document.createElement('canvas'); dbgB.width=HS; dbgB.height=HS;
function drawDebug(det){
  gctx.fillStyle='#000'; gctx.fillRect(0,0,340,270);
  const put=(arr,cnv,x0,y0,w,h)=>{const cc=cnv.getContext('2d');
    const img=cc.createImageData(cnv.width,cnv.height);
    for(let i=0;i<cnv.width*cnv.height;i++){const v=clamp01(arr[i])*255;
      img.data[i*4]=img.data[i*4+1]=img.data[i*4+2]=v;img.data[i*4+3]=255;}
    cc.putImageData(img,0,0); gctx.drawImage(cnv,x0,y0,w,h);};
  if(det&&det.S)put(det.S,dbgA,0,0,160,120);
  else{gctx.fillStyle='#222';gctx.fillRect(0,0,160,120);}
  if(burn)put(burn,dbgA,170,0,160,120);
  else{gctx.fillStyle='#222';gctx.fillRect(170,0,160,120);}
  if(Hcur)put(Hcur,dbgB,0,130,160,130);
  gctx.fillStyle='#9f9'; gctx.font='11px monospace';
  gctx.fillText(`${state} span=${det?det.span.toFixed(2):'-'} force=${force.toFixed(2)} dev=${develop.toFixed(2)}`,170,150);
  gctx.fillText(`cx=${det&&det.cx?det.cx.toFixed(2):'-'} area=${det&&det.area?(det.area*100).toFixed(1):'-'}%`,170,170);
  gctx.fillText('左:live 右上:burn 右下:heightfield',170,190);
}

/* ================= 啟動 ================= */
el('fs').onclick=()=>document.documentElement.requestFullscreen?.();
if('serviceWorker' in navigator && isSecureContext)
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
setOp('啟動中…');
init3D().then(()=>startCamera()).then(()=>requestAnimationFrame(tick))
 .catch(e=>{ if(!camErr)fatal('3D 初始化失敗：'+e.message); });
</script>
</body>
